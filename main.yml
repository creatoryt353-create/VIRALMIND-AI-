name: Build ViralMind APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf project && mkdir project
          unzip -q ViralMind_AI_Project.zip -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Inject backend URL
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: sed -i "s|__WORKER_URL__|${WORKER_URL}|" project/app/src/main/assets/www/config.js
      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ViralMind-AI-APK
          path: project/app/build/outputs/apk/debug/*.apk
